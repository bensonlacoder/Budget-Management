; Settings for sending sign-up and password reset codes (ticket T15).
;
; Copy this file to email-sender.ini in the app's local data folder
; (on Windows: %LOCALAPPDATA%\DiningPointsBudget\email-sender.ini), or set the
; DINING_POINTS_EMAIL_CONFIG environment variable to its path.
; Never commit email-sender.ini: it contains the shared secret.

[sender]
; The web app URL from Deploy > Manage deployments in Apps Script.
url=https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec
; The same value as the SHARED_SECRET script property.
secret=replace-with-a-long-random-secret
