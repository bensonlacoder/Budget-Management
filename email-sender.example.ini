; Optional settings for sending email codes. The app works without this file: it uses
; the team's sender built into UI/emailsender.h (EmailSender::DefaultUrl).
;
; To use a different Apps Script deployment, copy this file to email-sender.ini in the
; app's local data folder (on Windows: %LOCALAPPDATA%\DiningPointsBudget\email-sender.ini),
; or set the DINING_POINTS_EMAIL_CONFIG environment variable to its path.

[sender]
; The web app URL from Deploy > Manage deployments in Apps Script.
; Leave it empty (url=) to turn sending off.
url=https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec
